name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Django to staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 185.250.37.246
          username: root
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          script: |
            set -e
            cd /opt/transfers-staging
            git pull origin staging
            source venv/bin/activate
            pip install -r requirements.txt -q
            DJANGO_SETTINGS_MODULE=config.settings.staging python manage.py migrate --noinput
            DJANGO_SETTINGS_MODULE=config.settings.staging python manage.py collectstatic --noinput
            systemctl restart transfers-staging celery-staging
            echo "Staging deploy complete"
